apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-backend
  labels:
    app: flowminer
    component: backend
spec:
  replicas: {{ .Values.replicas.backend }}
  selector:
    matchLabels:
      app: flowminer
      component: backend
  template:
    metadata:
      labels:
        app: flowminer
        component: backend
    spec:
      containers:
        - name: backend
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
          ports:
            - containerPort: 8000
          env:
            - name: ENV
              value: {{ .Values.environment }}
            - name: DATABASE_URL
              value: {{ .Values.database.externalUrl | default (printf "postgresql+asyncpg://flowminer:flowminer@%s-postgres:5432/flowminer" .Release.Name) | quote }}
            - name: SYNC_DATABASE_URL
              value: {{ .Values.database.externalUrl | default (printf "postgresql://flowminer:flowminer@%s-postgres:5432/flowminer" .Release.Name) | quote }}
            - name: REDIS_URL
              value: {{ .Values.redis.externalUrl | default (printf "redis://%s-redis:6379/0" .Release.Name) | quote }}
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: secret-key
            - name: FLOWMINER_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: encryption-key
                  optional: true
            - name: FLOWMINER_LLM_PROVIDER
              value: {{ .Values.secrets.llmProvider | quote }}
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: anthropic-api-key
                  optional: true
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: openai-api-key
                  optional: true
            - name: SENTRY_DSN
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: sentry-dsn
                  optional: true
            - name: UPLOAD_DIR
              value: /data/uploads
          volumeMounts:
            - name: uploads
              mountPath: /data/uploads
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8000
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 30
          resources:
{{ toYaml .Values.resources.backend | indent 12 }}
      volumes:
        - name: uploads
{{- if .Values.storage.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-uploads
{{- else }}
          emptyDir: {}
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-backend
spec:
  selector:
    app: flowminer
    component: backend
  ports:
    - port: 8000
      targetPort: 8000
