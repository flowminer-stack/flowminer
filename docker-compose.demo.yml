# FlowMiner — demo instance override.
#
# Layers on top of docker-compose.yml to turn the default production
# stack into a locked-down public demo at demo.flowminer.io:
#
#   * DEMO_MODE=1 on backend + worker + beat — the startup lifespan
#     seeds a read-only demo user and preloaded event logs, the
#     /auth/demo endpoint starts returning JWTs, and the demo
#     write-guard middleware rejects POST/PUT/PATCH/DELETE outside
#     the analytics allowlist.
#
#   * docs/examples is bind-mounted read-only into the containers at
#     /app/docs/examples so the seeder can find the sample logs.
#     The path matches _EXAMPLES_DIR in app/services/demo_seeder.py.
#
#   * FLOWMINER_LLM_PROVIDER=openrouter + OPENROUTER_API_KEY required.
#     The demo always runs against a project-owned OpenRouter key so
#     Ask AI works out of the box for visitors. The landing page
#     already promises this.
#
#   * The frontend image picks up VITE_DEMO_MODE=1 at build time so
#     the SPA hostname check is bypassed and bootstrapDemo always
#     kicks in regardless of URL (useful when serving the image from
#     a proxy-rewritten Host header).
#
# Usage from the repo root:
#
#     docker compose -f docker-compose.yml -f docker-compose.demo.yml up -d --build
#
# Required environment (put these in .env or export before running):
#
#     SECRET_KEY, POSTGRES_PASSWORD, REDIS_PASSWORD   — normal compose vars
#     OPENROUTER_API_KEY                              — demo Ask AI
#     CORS_ORIGINS=https://demo.flowminer.io          — trims CORS to the
#                                                       public demo host
#

services:
  backend:
    environment:
      DEMO_MODE: "1"
      FLOWMINER_LLM_PROVIDER: openrouter
      # CORS tight to the public demo host. Override via .env if needed.
      CORS_ORIGINS: ${CORS_ORIGINS:-https://demo.flowminer.io}
    volumes:
      # Read-only bind so the seeder can see the sample logs. The
      # backend service only reads from this path; it never writes.
      - ./docs/examples:/app/docs/examples:ro

  worker:
    environment:
      DEMO_MODE: "1"
      FLOWMINER_LLM_PROVIDER: openrouter
    volumes:
      - ./docs/examples:/app/docs/examples:ro

  beat:
    environment:
      DEMO_MODE: "1"
    volumes:
      - ./docs/examples:/app/docs/examples:ro

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_DEMO_MODE: "1"
