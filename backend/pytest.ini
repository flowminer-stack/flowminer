[pytest]
asyncio_mode = auto
testpaths = tests
addopts = -q --tb=short
markers =
    unit: offline, no Docker/network (respx + synthetic fixtures) — the default CI suite
    integration: needs Docker (testcontainers / docker-compose.test.yml) — seeded real DBs
    live: hits a real free dev org (GitHub/Salesforce/ServiceNow/Jira) or replays its cassette; nightly only
