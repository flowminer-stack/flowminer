[alembic]
script_location = alembic
prepend_sys_path = .
# sqlalchemy.url is populated at runtime by alembic/env.py from the
# SYNC_DATABASE_URL environment variable. Leaving this placeholder
# empty is intentional — the previous value ("postgresql://flowminer:
# flowminer@db:5432/flowminer") was a dev default and should not
# appear in a source file that ships to GitHub.
sqlalchemy.url = driver://user:pass@host/dbname

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
