[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flowminer-sdk"
version = "0.1.0"
description = "Async Python client for FlowMiner — the open-source process mining platform"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "FlowMiner" }]
dependencies = [
    "httpx>=0.27",
]

[project.urls]
Homepage = "https://github.com/flowminer/flowminer"

[tool.setuptools.packages.find]
where = ["."]
include = ["flowminer*"]
