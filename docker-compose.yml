# FlowMiner — production-safe default compose.
#
# Running `docker compose up -d` with this file gives you:
#   * Pinned image tags so rebuilds are reproducible.
#   * Healthchecks on every service so `depends_on` actually waits.
#   * Restart policies so a crashed service doesn't stay dead.
#   * Bounded logging (10 MB × 3 files per service).
#   * A private Docker network — services can talk to each other
#     by name, nothing is exposed to the host except the
#     reverse-proxy ports 3000 (SPA) and optionally 80 (nginx).
#   * No source bind mounts. For local development with
#     hot-reload mount the source tree via the override file:
#
#         docker compose -f docker-compose.yml -f docker-compose.dev.yml up
#
# Requirements:
#   * Docker Engine 20.10+
#   * Docker Compose V2 (the `docker compose` plugin, NOT the
#     legacy `docker-compose` V1 Python package).
#
# Before first run:
#   1. Copy `.env.example` to `.env` and set EVERY `:?error`-marked
#      variable. The compose file will refuse to start if any are
#      missing.
#   2. Optional but strongly recommended: set FLOWMINER_ENCRYPTION_KEY
#      so server-stored API keys (OpenRouter / Anthropic / OpenAI)
#      are encrypted at rest.

# ── YAML anchors for DRY env blocks ───────────────────────────────────
#
# All three Python services (backend, worker, beat) share the same
# environment. Defining it once here and referencing with `<<: *app_env`
# prevents the three blocks from drifting.
x-app-env: &app_env
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-flowminer}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-flowminer}
  SYNC_DATABASE_URL: postgresql://${POSTGRES_USER:-flowminer}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-flowminer}
  REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
  SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required — generate with `openssl rand -hex 32`}
  FLOWMINER_ENCRYPTION_KEY: ${FLOWMINER_ENCRYPTION_KEY:-}
  ENV: ${ENV:-production}
  UPLOAD_DIR: /data/uploads
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost}
  SENTRY_DSN: ${SENTRY_DSN:-}
  # LLM provider configuration (all optional — the null provider
  # ships a working fallback so the UI works with no credentials).
  FLOWMINER_LLM_PROVIDER: ${FLOWMINER_LLM_PROVIDER:-null}
  OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
  OPENROUTER_MODEL: ${OPENROUTER_MODEL:-anthropic/claude-haiku-4-5}
  OPENROUTER_SITE_URL: ${OPENROUTER_SITE_URL:-}
  OPENROUTER_APP_NAME: ${OPENROUTER_APP_NAME:-FlowMiner}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-4-6}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
  # SMTP — leave blank to disable outbound email entirely.
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASS: ${SMTP_PASS:-}
  SMTP_FROM: ${SMTP_FROM:-alerts@flowminer.io}
  # Demo mode — flip to 1 (env var, .env file, or Dokploy UI) to
  # turn this stack into a locked-down public demo at boot:
  # seeds a demo user + preloaded logs, unlocks /auth/demo, and
  # activates the write-guard middleware. Default off so any
  # non-demo deployment stays unaffected.
  DEMO_MODE: ${DEMO_MODE:-0}
  DEMO_USER_EMAIL: ${DEMO_USER_EMAIL:-demo@demo.flowminer.io}
  DEMO_USER_NAME: ${DEMO_USER_NAME:-Demo Visitor}
  # Seed sample data without the demo lock-down — see backend
  # config.py for the difference between this flag and DEMO_MODE.
  SEED_SAMPLE_DATA_ON_FIRST_BOOT: ${SEED_SAMPLE_DATA_ON_FIRST_BOOT:-0}

# Bounded logging — applies to every service. Without this, Docker's
# default json-file driver writes unbounded log files on the host
# that eventually fill the disk on long-running deployments.
x-logging: &logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

# Common restart policy for the long-running services. ``unless-stopped``
# means Docker will restart the container on crash and after host
# reboots, but NOT if the operator explicitly stopped it.
x-restart: &restart_policy unless-stopped


services:
  # ─── PostgreSQL ────────────────────────────────────────────────────
  db:
    image: postgres:16.6-alpine
    restart: *restart_policy
    logging: *logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-flowminer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required — set it in .env}
      POSTGRES_DB: ${POSTGRES_DB:-flowminer}
    shm_size: 256m
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-flowminer}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    mem_limit: 2g
    networks:
      - flowminer
    security_opt:
      - no-new-privileges:true

  # ─── Redis ─────────────────────────────────────────────────────────
  redis:
    image: redis:7.4-alpine
    restart: *restart_policy
    logging: *logging
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD is required — set it in .env}
      - --appendonly
      - "yes"
      - --save
      - "60 1"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    mem_limit: 1g
    networks:
      - flowminer
    security_opt:
      - no-new-privileges:true

  # ─── FastAPI backend ───────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      # Pull docs/examples into the build even though it lives outside
      # the backend context, so the demo seeder can find the sample
      # logs inside the image without needing a runtime bind mount.
      # Requires Docker Compose v2.17+ / BuildKit; both Dokploy and
      # modern Docker Engine support this.
      additional_contexts:
        examples: ./docs/examples
    image: flowminer-backend:local
    restart: *restart_policy
    logging: *logging
    environment: *app_env
    volumes:
      - upload_data:/data/uploads
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request, sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status == 200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 120s
    mem_limit: 3g
    networks:
      - flowminer
    security_opt:
      - no-new-privileges:true

  # ─── Celery worker ─────────────────────────────────────────────────
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      # Pull docs/examples into the build even though it lives outside
      # the backend context, so the demo seeder can find the sample
      # logs inside the image without needing a runtime bind mount.
      # Requires Docker Compose v2.17+ / BuildKit; both Dokploy and
      # modern Docker Engine support this.
      additional_contexts:
        examples: ./docs/examples
    image: flowminer-backend:local
    restart: *restart_policy
    logging: *logging
    environment: *app_env
    volumes:
      - upload_data:/data/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        # Wait for the backend to be healthy — this avoids the cold-
        # start race where worker + backend race to run Alembic
        # migrations simultaneously.
        condition: service_healthy
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=2
    # Worker is a long-running process, not an HTTP server — override
    # the HTTP healthcheck baked into the backend image with a
    # process-based one.
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'celery.*worker' > /dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    mem_limit: 2g
    networks:
      - flowminer
    security_opt:
      - no-new-privileges:true

  # ─── Celery beat (scheduler) ───────────────────────────────────────
  beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
      # Pull docs/examples into the build even though it lives outside
      # the backend context, so the demo seeder can find the sample
      # logs inside the image without needing a runtime bind mount.
      # Requires Docker Compose v2.17+ / BuildKit; both Dokploy and
      # modern Docker Engine support this.
      additional_contexts:
        examples: ./docs/examples
    image: flowminer-backend:local
    restart: *restart_policy
    logging: *logging
    environment:
      <<: *app_env
      # Prepend /app so celery can find the app.workers module
      # regardless of the current working directory.
      PYTHONPATH: /app
    volumes:
      - upload_data:/data/uploads
      # Keep the beat schedule under /data/uploads so it reuses the
      # existing chown from the Dockerfile (the ``flowminer`` uid
      # already owns /data/uploads). Using a separate named volume
      # would require an extra init step to chown it on first boot.
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    # Ensure the schedule directory exists (idempotent) before
    # launching beat. /home/flowminer is owned by the flowminer
    # user so the write always succeeds; pre-existing volumes
    # with stricter ownership don't break the startup path.
    command:
      - sh
      - -c
      - "mkdir -p /home/flowminer/.beat && exec celery -A app.workers.celery_app beat --loglevel=info --schedule=/home/flowminer/.beat/celerybeat-schedule"
    # The backend image HEALTHCHECK assumes a uvicorn server on
    # port 8000; beat doesn't serve HTTP. Override with a check
    # that a celery beat process is actually running.
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'celery.*beat' > /dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    mem_limit: 512m
    networks:
      - flowminer
    security_opt:
      - no-new-privileges:true

  # ─── Frontend (nginx serving built SPA) ────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: flowminer-frontend:local
    restart: *restart_policy
    logging: *logging
    expose:
      - "80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    mem_limit: 512m
    networks:
      - flowminer
    security_opt:
      - no-new-privileges:true

# ── Named volumes ─────────────────────────────────────────────────────
#
# Docker manages these volumes for us. Back up ``postgres_data`` and
# ``upload_data`` on any schedule you trust; losing them means losing
# the process data itself. ``redis_data`` is just Celery job state —
# losing it is usually fine.
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  upload_data:
    driver: local


# ── Networks ──────────────────────────────────────────────────────────
#
# ``flowminer`` — private bridge so services resolve each other by name
# (``db``, ``redis``, ``backend``) without leaking onto the host bridge.
#
# ``dokploy-network`` — Dokploy's Traefik routes traffic from the public
# internet through this shared network. Any service that needs a domain
# in the Dokploy UI must be attached to it.
networks:
  flowminer:
    driver: bridge
  dokploy-network:
    external: true
