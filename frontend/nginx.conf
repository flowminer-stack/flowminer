server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # /health and /health/ready proxy straight to the backend so
    # external uptime monitors (and the `make wait` helper) get
    # the real status instead of the SPA shell. Without this both
    # paths would fall through to try_files and return 200 with
    # the index.html body, masking real outages.
    location = /health {
        resolver 127.0.0.11 valid=10s;
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
    }
    location = /health/ready {
        resolver 127.0.0.11 valid=10s;
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
    }

    location /api {
        resolver 127.0.0.11 valid=10s;
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        client_max_body_size 500M;

        # Streaming endpoints (/api/v1/ai/chat, /api/v1/ai/agent) emit
        # newline-delimited JSON chunks. Nginx's default response
        # buffering holds those chunks until the upstream closes the
        # connection, which makes the chat UI look stuck for the whole
        # generation and then dump everything at once (or nothing, if
        # the client times out). Disable buffering and force HTTP/1.1
        # so chunked transfer encoding flows through.
        proxy_buffering off;
        proxy_cache off;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }
}
