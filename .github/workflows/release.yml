name: Release

# Triggered when a version tag is pushed (e.g. v0.1.0, v1.2.3).
# Builds multi-arch Docker images and pushes them to GHCR.
on:
  push:
    tags:
      - "v*"

jobs:
  release:
    name: Build & push images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      # Derive the version + the full set of image tags to publish.
      #
      # Channels (all v-prefixed so they match the docker-compose.yml
      # reference `:${FLOWMINER_VERSION:-v0.1.0}`):
      #   v0.1.0   exact, immutable          (always)
      #   v0.1     latest patch of a minor   (stable releases only)
      #   v0       latest of the 0.x series  (stable releases only)
      #   stable   latest non-prerelease     (stable releases only)
      #   latest   latest non-prerelease     (stable releases only)
      #
      # A prerelease tag (contains a hyphen, e.g. v0.2.0-rc1) publishes
      # ONLY its exact tag, so it never moves the moving channels.
      - name: Derive version + tags
        id: version
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          RAW="${GITHUB_REF_NAME}"          # e.g. v0.1.0 or v0.2.0-rc1
          VERSION="${RAW#v}"                # strip leading v → 0.1.0
          CORE="${VERSION%%-*}"             # strip prerelease → 0.1.0
          MAJOR="${CORE%%.*}"               # 0
          REST="${CORE#*.}"                 # 1.0
          MINOR="${REST%%.*}"               # 1
          PRERELEASE=""
          case "$VERSION" in *-*) PRERELEASE="1";; esac

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${RAW}"   >> "$GITHUB_OUTPUT"

          emit_tags() {
            local image="ghcr.io/${OWNER}/$1"
            echo "${image}:${RAW}"
            if [ -z "$PRERELEASE" ]; then
              echo "${image}:v${MAJOR}.${MINOR}"
              echo "${image}:v${MAJOR}"
              echo "${image}:stable"
              echo "${image}:latest"
            fi
          }

          {
            echo "backend_tags<<EOF";  emit_tags flowminer-backend;  echo "EOF"
            echo "frontend_tags<<EOF"; emit_tags flowminer-frontend; echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up QEMU (multi-arch emulation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ─── Backend ───────────────────────────────────────────────────
      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          build-contexts: |
            examples=./docs/examples
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.version.outputs.backend_tags }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
          labels: |
            org.opencontainers.image.title=FlowMiner Backend
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      # ─── Frontend ──────────────────────────────────────────────────
      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.version.outputs.frontend_tags }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
          labels: |
            org.opencontainers.image.title=FlowMiner Frontend
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
