name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install system deps for pm4py
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz

      - name: Install Python deps
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest
        working-directory: backend
        env:
          ENV: development
          SECRET_KEY: ci-test-secret-key-long-enough
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
          SYNC_DATABASE_URL: "sqlite:///:memory:"
        run: |
          python -m pytest -q --tb=short

  migrations:
    name: Migrations (fresh Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: flowminer
          POSTGRES_PASSWORD: flowminer
          POSTGRES_DB: flowminer
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flowminer"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install system deps for pm4py
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz

      - name: Install Python deps
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Guards the migration chain: a fresh `alembic upgrade head` must run the
      # whole chain cleanly (the baseline uses metadata.create_all, so every
      # later migration must be idempotent), and `alembic check` must report no
      # drift between the migrated schema and the ORM models.
      - name: alembic upgrade head (fresh DB) + check for drift
        working-directory: backend
        env:
          ENV: development
          SECRET_KEY: ci-test-secret-key-long-enough
          DATABASE_URL: "postgresql+asyncpg://flowminer:flowminer@localhost:5432/flowminer"
          SYNC_DATABASE_URL: "postgresql://flowminer:flowminer@localhost:5432/flowminer"
        run: |
          alembic upgrade head
          alembic check

  frontend:
    name: Frontend typecheck & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        working-directory: frontend
        run: npm ci

      - name: Typecheck
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Build
        working-directory: frontend
        run: npx vite build

      - name: Design token check
        working-directory: frontend
        run: node scripts/check-design-tokens.mjs

  docker-images:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          # backend/Dockerfile's `COPY --from=examples` needs this named
          # build context (resolved from the repo root, like release.yml).
          # Without it the build errors on an undefined context.
          build-contexts: |
            examples=./docs/examples
          push: false
          load: true
          tags: flowminer-backend:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          load: true
          tags: flowminer-frontend:ci
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          # Fail the build on any leaked secret. This is a
          # best-effort scan — false positives can be silenced
          # via .gitleaksignore.
          GITLEAKS_NOTIFY_USER_LIST: ""
        continue-on-error: true
